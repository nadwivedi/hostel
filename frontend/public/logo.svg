<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#gradient1)"/>

  <!-- Building/Hostel Icon -->
  <g transform="translate(14, 12)">
    <!-- Main Building -->
    <path d="M18 0L0 12V40H36V12L18 0Z" fill="white" opacity="0.95"/>

    <!-- Roof accent -->
    <path d="M18 0L0 12H36L18 0Z" fill="white"/>

    <!-- Door -->
    <rect x="14" y="24" width="8" height="16" rx="1" fill="url(#gradient2)"/>

    <!-- Windows Row 1 -->
    <rect x="4" y="16" width="6" height="5" rx="1" fill="url(#gradient2)" opacity="0.8"/>
    <rect x="26" y="16" width="6" height="5" rx="1" fill="url(#gradient2)" opacity="0.8"/>

    <!-- Windows Row 2 -->
    <rect x="4" y="26" width="6" height="5" rx="1" fill="url(#gradient2)" opacity="0.8"/>
    <rect x="26" y="26" width="6" height="5" rx="1" fill="url(#gradient2)" opacity="0.8"/>

    <!-- Chimney -->
    <rect x="26" y="4" width="4" height="6" fill="white" opacity="0.9"/>
  </g>

  <!-- People Icons at bottom -->
  <g transform="translate(20, 48)">
    <circle cx="4" cy="2" r="2" fill="white" opacity="0.8"/>
    <circle cx="12" cy="2" r="2" fill="white" opacity="0.8"/>
    <circle cx="20" cy="2" r="2" fill="white" opacity="0.8"/>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="50%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>
</svg>
